<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in — Campus Access</title>
  <meta name="description" content="Secure college sign-in with one-time passcode verification." />
  <link rel="stylesheet" href="styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body>
  <main class="page">
    <div class="blob blob-gold" aria-hidden="true"></div>
    <div class="blob blob-luxe" aria-hidden="true"></div>
    <div class="dots" aria-hidden="true"></div>

    <section class="wrap">
      <h1 class="title">Welcome back</h1>
      <p class="subtitle">Sign in with your college credentials to continue.</p>

      <div class="card-shell">
        <div class="card-glow" aria-hidden="true"></div>
        <div class="card">
          <header class="card-header">
            <div class="brand-icon" aria-hidden="true">
              <!-- sparkles -->
              <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3-1.9 5.8a2 2 0 0 1-1.3 1.3L3 12l5.8 1.9a2 2 0 0 1 1.3 1.3L12 21l1.9-5.8a2 2 0 0 1 1.3-1.3L21 12l-5.8-1.9a2 2 0 0 1-1.3-1.3z"/></svg>
            </div>
            <div>
              <p class="eyebrow">Campus Access</p>
              <h2 class="card-title">Sign in to continue</h2>
            </div>
          </header>

          <div class="card-body">
            <!-- Stepper -->
            <div class="stepper">
              <span class="step" id="step1">1</span>
              <span class="step-line"></span>
              <span class="step" id="step2">2</span>
            </div>

            <!-- Step 1: Details -->
            <form id="form-details" class="form">
              <div class="field">
                <label for="name">Full name</label>
                <div class="input-wrap">
                  <svg class="i-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                  <input id="name" name="name" type="text" placeholder="Aarav Sharma" autocomplete="name" required />
                </div>
              </div>

              <div class="field">
                <label for="college">College name</label>
                <div class="input-wrap">
                  <svg class="i-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5a6 3 0 0 0 12 0v-5"/></svg>
                  <input id="college" name="college" type="text" placeholder="Indian Institute of Technology" required />
                </div>
              </div>

              <div class="field">
                <label for="email">College email</label>
                <div class="input-wrap">
                  <svg class="i-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 5L2 7"/></svg>
                  <input id="email" name="email" type="email" placeholder="you@college.edu" autocomplete="email" required />
                </div>
              </div>

              <p class="error" id="error-details" role="alert"></p>

              <button type="submit" class="btn btn-primary" id="btn-send">
                <span class="btn-label">Send OTP</span>
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
              </button>
            </form>

            <!-- Step 2: OTP -->
            <form id="form-otp" class="form hidden">
              <div class="otp-info">
                <p class="muted">We sent a 4-digit code to</p>
                <p class="strong" id="otp-email"></p>
              </div>

              <div class="otp-group" id="otp-group">
                <input class="otp-slot" inputmode="numeric" maxlength="1" />
                <input class="otp-slot" inputmode="numeric" maxlength="1" />
                <input class="otp-slot" inputmode="numeric" maxlength="1" />
                <input class="otp-slot" inputmode="numeric" maxlength="1" />
              </div>

              <p class="error center" id="error-otp" role="alert"></p>

              <div class="row-between">
                <button type="button" class="link-btn" id="btn-edit">
                  <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg>
                  Edit details
                </button>
                <button type="button" class="link-btn gold" id="btn-resend">
                  <svg id="resend-icon" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg>
                  <span id="resend-label">Resend OTP</span>
                </button>
              </div>

              <button type="submit" class="btn btn-primary" id="btn-verify">
                <span class="btn-label">Verify & continue</span>
              </button>
            </form>

            <!-- Step 3: Success -->
            <div id="success" class="success hidden">
              <div class="success-icon">
                <svg viewBox="0 0 24 24" width="32" height="32" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/></svg>
              </div>
              <h3 class="success-title">Welcome, <span id="success-name"></span>!</h3>
              <p class="muted">You're signed in with <span class="strong" id="success-college"></span>.</p>
              <button type="button" class="btn btn-outline" id="btn-signout">Sign out</button>
            </div>

            <p class="legal">By continuing, you agree to our Terms & Privacy Policy.</p>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
